<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rossa Ragazza - магазин одежды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ШАПКА САЙТА -->
<div class="header">
    <div class="logo">
        <h1>✨ Rossa Ragazza</h1>
        <p>рыжая девушка · тёплый стиль</p>
    </div>
    <div>
        <button class="cart-btn" onclick="openCart()">🛒 Корзина (<span id="cartCount">0</span>)</button>
        <button class="fav-btn" onclick="openFavorites()">❤️ Избранное (<span id="favCount">0</span>)</button>
    </div>
</div>

<!-- ФИЛЬТРЫ -->
<div class="filters">
    <div class="filter-group">
        <label>📂 Категория:</label>
        <select id="filterCat" onchange="filterProducts()">
            <option value="all">Все</option>
            <option value="Платья">Платья</option>
            <option value="Блузы">Блузы</option>
            <option value="Юбки">Юбки</option>
            <option value="Кардиганы">Кардиганы</option>
        </select>
    </div>
    <div class="filter-group">
        <label>📏 Размер:</label>
        <select id="filterSize" onchange="filterProducts()">
            <option value="all">Все</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
        </select>
    </div>
    <div class="filter-group">
        <label>💰 Цена до:</label>
        <input type="number" id="filterPrice" placeholder="любая" onchange="filterProducts()">
    </div>
    <button onclick="resetFilters()">Сбросить всё</button>
</div>

<!-- ТОВАРЫ -->
<div id="productsContainer" class="products"></div>

<!-- ПОДВАЛ -->
<footer>
    <p>Rossa Ragazza — одежда для нежной и уверенной девушки</p>
    <p>Вдохновение итальянским уютом и тёплыми оттенками осени 🍂</p>
</footer>

<!-- КОРЗИНА (модальное окно) -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeCart()">&times;</span>
        <h2>🛍️ Корзина</h2>
        <div id="cartItems"></div>
        <div id="cartTotal" class="total"></div>
        <button onclick="checkout()" style="width:100%; margin-top:15px;">Оформить заказ</button>
    </div>
</div>

<!-- ИЗБРАННОЕ (модальное окно) -->
<div id="favModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeFav()">&times;</span>
        <h2>❤️ Избранное</h2>
        <div id="favItems"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
